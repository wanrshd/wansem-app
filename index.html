<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expenses</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<meta name="theme-color" content="#e7f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#03110f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Wansem Expenses PWA. Same glass + teal look as the Apps Script dashboard, phone first. */
:root{color-scheme:light dark;
--bg:#e7f3f0;--b1:#9fe3d3;--b2:#c9efe4;--b3:#7fd1c3;
--glass:rgba(255,255,255,.52);--glass2:rgba(255,255,255,.66);--edge:rgba(255,255,255,.85);--shade:rgba(15,60,52,.10);
--ink:#0b1f1c;--ink2:rgba(11,31,28,.58);--ink3:rgba(11,31,28,.38);--sep:rgba(11,31,28,.10);--fill:rgba(11,31,28,.07);
--teal:#0e9f8a;--tealS:rgba(14,159,138,.14);--onteal:#fff;--sheet:rgba(246,251,250,.82)}
@media (prefers-color-scheme:dark){:root{
--bg:#03110f;--b1:#0d5c51;--b2:#0a3d37;--b3:#11786a;
--glass:rgba(30,40,38,.46);--glass2:rgba(255,255,255,.10);--edge:rgba(255,255,255,.16);--shade:rgba(0,0,0,.45);
--ink:#f2fbf8;--ink2:rgba(242,251,248,.6);--ink3:rgba(242,251,248,.36);--sep:rgba(255,255,255,.09);--fill:rgba(255,255,255,.09);
--teal:#2fd4b6;--tealS:rgba(47,212,182,.16);--onteal:#04241f;--sheet:rgba(16,28,26,.86)}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;position:relative}
button{font:inherit;color:inherit}
.wall{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wall i{position:absolute;border-radius:50%;filter:blur(60px)}
.wall i:nth-child(1){width:60vmax;height:60vmax;left:-18vmax;top:-22vmax;background:var(--b1)}
.wall i:nth-child(2){width:50vmax;height:50vmax;right:-20vmax;top:20vh;background:var(--b3);opacity:.7}
.wall i:nth-child(3){width:55vmax;height:55vmax;left:10vw;bottom:-30vmax;background:var(--b2)}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 120px) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sub{color:var(--ink2);font-size:15px;margin:0 0 2px;min-height:21px}
h1{font:700 clamp(34px,8vw,46px)/1.05 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;letter-spacing:-.025em;margin:0}
.gl{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),0 10px 34px var(--shade)}
.icon-btn{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hbtns{display:flex;gap:8px}
.months{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-radius:999px;padding:4px;margin-bottom:16px;width:max-content;max-width:100%}
.months::-webkit-scrollbar{display:none}
.months button{all:unset;cursor:pointer;font-size:15px;font-weight:500;padding:7px 16px;border-radius:999px;color:var(--ink2);white-space:nowrap;flex:none}
.months button[aria-pressed=true]{background:var(--glass2);color:var(--ink);font-weight:600;box-shadow:inset 0 1px 0 var(--edge),0 2px 8px var(--shade)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.card{border-radius:28px;padding:22px 20px 20px}
.lab{font-size:14px;color:var(--ink2);margin:0 0 4px;font-weight:500}
.big{font:700 clamp(44px,13vw,64px)/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.42em;font-weight:600;color:var(--ink2);margin-right:5px;letter-spacing:0}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 4px}
.meta b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{position:relative;height:160px;margin-top:16px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart text{font-size:11px;fill:var(--ink2)}
.ringc{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:120px;aspect-ratio:1;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .in b{font-size:17px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring .in span{font-size:11px;color:var(--ink2)}
.ringc p{margin:0;font-size:15px;color:var(--ink2)}
.ringc p b{color:var(--ink);font-weight:600}
h2{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0 0 14px}
.stor{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:3px;background:var(--fill)}
.stor i{display:block;height:100%;border-radius:999px}
.legend{list-style:none;margin:14px 0 0;padding:0}
.legend li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep)}
.legend li:first-child{border-top:0}
.ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:16px;background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge),0 1px 3px var(--shade)}
.nm>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c{font-size:13px;color:var(--ink2)}
.legend .pc{color:var(--ink2);font-size:15px;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.amt,.tx .a{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.day{font-size:13px;color:var(--ink2);font-weight:600;margin:18px 0 6px;display:flex;justify-content:space-between}
.day:first-child{margin-top:0}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--sep)}
.tx.f{border-top:0}
.tx .n{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx.pending{opacity:.55}
.more{all:unset;cursor:pointer;color:var(--teal);font-size:15px;font-weight:600;margin-top:14px;display:inline-block;padding:8px 16px;border-radius:999px;background:var(--tealS)}
.foot{color:var(--ink3);font-size:13px;text-align:center;margin-top:24px}
.empty{color:var(--ink2);font-size:15px;margin:0}
/* floating add button */
.fab{all:unset;cursor:pointer;position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;align-items:center;gap:8px;padding:15px 30px;border-radius:999px;font-weight:600;font-size:17px;color:var(--onteal);background:var(--teal);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 30px rgba(14,120,104,.35)}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;fill:none}
.fab:active{transform:translateX(-50%) scale(.96)}
/* bottom sheets */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:11;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:calc(100svh - env(safe-area-inset-top,0px) - 12px);overflow:auto;border-radius:30px 30px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--edge);border-bottom:0;box-shadow:0 -10px 40px var(--shade);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s .32s}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--ink3);margin:0 auto 10px}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.shead h3{margin:0;font-size:17px;font-weight:600}
.link{all:unset;cursor:pointer;color:var(--teal);font-size:17px;padding:8px 4px}
.link.b{font-weight:600}
.amtin{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:10px 0 18px}
.amtin span{font-size:26px;font-weight:600;color:var(--ink2)}
.amtin input{all:unset;width:2.8em;max-width:70vw;font:700 56px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-align:left;caret-color:var(--teal)}
.amtin input::placeholder{color:var(--ink3)}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.cats button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:18px;background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge);font-size:13px;font-weight:500;color:var(--ink2);text-align:center}
.cats button b{font-size:22px;font-weight:400}
.cats button[aria-pressed=true]{background:var(--tealS);color:var(--ink);box-shadow:inset 0 0 0 2px var(--teal)}
.field{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:var(--glass2);box-shadow:inset 0 1px 0 var(--edge);margin-bottom:10px}
.field label{font-size:15px;color:var(--ink2);flex:none}
.field input{all:unset;flex:1;padding:13px 0;font-size:17px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .field{margin-bottom:0}
.field input[type=date],.field input[type=time]{text-align:right}
.save{all:unset;cursor:pointer;display:block;width:100%;text-align:center;padding:16px 0;margin-top:16px;border-radius:16px;background:var(--teal);color:var(--onteal);font-weight:600;font-size:17px;box-sizing:border-box}
.save:disabled{opacity:.4;cursor:default}
.note{font-size:13px;color:var(--ink2);margin:8px 2px 0}
.toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;transition:transform .3s;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{transform:translate(-50%,0)}
.setup{max-width:480px;margin:10vh auto 0}
.setup ol{padding-left:20px;color:var(--ink2);font-size:15px}
.setup li{margin-bottom:6px}
@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(min-width:761px){.ringc{flex-direction:column;text-align:center;justify-content:center}.ring{width:min(200px,100%)}.ring .in b{font-size:26px}.ring .in span{font-size:13px}.meta{grid-template-columns:repeat(3,max-content);gap:28px}.meta b{font-size:20px}.chart{height:190px}}
@media(prefers-reduced-transparency:reduce){.gl{background:var(--bg)}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}
</style>
</head>
<body>
<div class="wall" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap" id="app">
  <header>
    <div><p class="sub" id="range">Loading…</p><h1>Expenses</h1></div>
    <div class="hbtns">
      <button class="icon-btn gl" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="icon-btn gl" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <div class="months gl" id="seg" role="group" aria-label="Month" hidden></div>
  <div id="main"></div>
  <p class="foot" id="foot"></p>
</div>

<button class="fab" id="openAdd" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add expense</button>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-label="Add expense">
  <div class="grab"></div>
  <div class="shead"><button class="link" data-close>Cancel</button><h3>New expense</h3><span style="width:56px"></span></div>
  <div class="amtin"><span>RM</span><input id="fAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount"></div>
  <div class="cats" id="fCats"></div>
  <div class="field"><label for="fRem">Remark</label><input id="fRem" placeholder="e.g. Nasi lemak" autocomplete="off" enterkeyhint="done"></div>
  <div class="row2">
    <div class="field"><label for="fDate">Date</label><input id="fDate" type="date"></div>
    <div class="field"><label for="fTime">Time</label><input id="fTime" type="time"></div>
  </div>
  <button class="save" id="fSave" disabled>Save</button>
</section>

<section class="sheet" id="setSheet" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="grab"></div>
  <div class="shead"><button class="link" data-close>Close</button><h3>Settings</h3><button class="link b" id="sSave">Save</button></div>
  <div class="field"><label for="sUrl">Sheet link</label><input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <p class="note">Your Apps Script web app link (the same one your Shortcut posts to). It stays on this phone only.</p>
  <p class="note" id="sQueue"></p>
</section>

<div class="toast gl" id="toast" role="status"></div>

<script>
{
const CATS=["🍔 Food","🧾 Bills","🛍️ Shopping","🚗 Transport","🎮 Entertainment","📦 Others"];
const MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MF=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY=864e5,$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rm=n=>"RM "+n.toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>d.getDate()+" "+MS[d.getMonth()];
const pad=n=>String(n).padStart(2,"0");
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// one-time setup link: index.html#u=<exec url>
let URL_=store.get("url","");
function fromHash(){if(location.hash.startsWith("#u=")){URL_=decodeURIComponent(location.hash.slice(3));store.set("url",URL_);return true}} // hash kept so Add to Home Screen captures it as the start URL
fromHash();
// also accept ?u= (some chat apps drop the #part of a link)
try{const q=new URLSearchParams(location.search).get("u");if(q){URL_=q;store.set("url",q)}}catch(e){}
// keep the link in the address so Add to Home Screen carries it into the installed app (iOS gives it separate storage)
const stamp=()=>{if(URL_&&!location.hash.startsWith("#u="))history.replaceState(null,"",location.pathname+"#u="+encodeURIComponent(URL_))};
stamp();
window.addEventListener("hashchange",()=>{if(fromHash()){render();load()}});
let cache=store.get("cache",null),queue=store.get("queue",[]);
let rows=[],budgets={},months=[],cur="",showAll=false,today=new Date();

function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("on"),2400)}

// ---------- data ----------
function prep(){
  const src=((cache&&cache.rows)||[]).concat(queue.map(q=>({d:q.iso,t:q.time,c:q.category,a:q.amount,r:q.remark,m:q.show||q.month,pending:1})));
  budgets=(cache&&cache.budgets)||{};
  rows=src.filter(x=>Number(x.a)>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.d)).map(x=>{const[y,m,d]=x.d.split("-").map(Number),c=String(x.c),sp=c.indexOf(" ");
    return{date:new Date(y,m-1,d),time:String(x.t||""),emoji:sp>0?c.slice(0,sp):"📦",cat:sp>0?c.slice(sp+1):c,amt:Number(x.a),note:String(x.r||"").trim(),month:String(x.m),pending:!!x.pending}});
  months=[...new Set(rows.map(r=>r.month))].sort();
  today=new Date();today.setHours(0,0,0,0);
  if(!months.includes(cur))cur=months[months.length-1]||"";
}
async function load(quiet){
  if(!URL_)return;
  const btn=$("refresh");btn.classList.add("spin");
  try{
    const r=await fetch(URL_+(URL_.includes("?")?"&":"?")+"format=full&_="+Date.now());
    const txt=await r.text();let j;
    try{j=JSON.parse(txt)}catch(e){throw new Error("notjson")}
    if(!j||!Array.isArray(j.rows))throw new Error("notjson");
    cache={rows:j.rows,budgets:j.budgets||{},at:Date.now()};store.set("cache",cache);
    prep();render();
  }catch(e){
    if(!quiet)toast(e.message==="notjson"?"Sheet link isn't returning data yet":"Offline, showing saved data");
    if(e.message==="notjson")$("range").textContent="Sheet not ready";
  }finally{btn.classList.remove("spin")}
}
async function flush(){
  if(!URL_||!queue.length||flush.busy)return;flush.busy=true;let sent=0;
  try{
    while(queue.length){
      const q=queue[0];
      const body={date:q.date,time:q.time,category:q.category,amount:q.amount,remark:q.remark,month:q.month};
      const r=await fetch(URL_,{method:"POST",body:JSON.stringify(body)});
      if(!r.ok)throw new Error(r.status);
      queue.shift();store.set("queue",queue);sent++;
    }
  }catch(e){}finally{flush.busy=false}
  if(sent){toast(sent>1?`Saved ${sent} expenses`:"Saved to sheet");await load(true)}
  else if(queue.length)render();
}

// ---------- render ----------
const cycle=m=>{const y=+m.slice(0,4),mo=+m.slice(5,7)-1;return[new Date(y,mo-1,26),new Date(y,mo,25)]};
const SH=[1,.72,.52,.36,.24,.16];
function render(){
  if(!URL_){renderSetup();return}
  $("openAdd").hidden=false;
  if(!rows.length){$("range").textContent=cache?"No spending yet":"Loading…";$("main").innerHTML="";$("seg").hidden=true;return}
  const R=rows.filter(r=>r.month===cur),[s,e]=cycle(cur);
  const total=R.reduce((a,r)=>a+r.amt,0);
  const lastD=today<e?today:e,elapsed=Math.max(1,Math.round((lastD-s)/DAY)+1),len=Math.round((e-s)/DAY)+1;
  $("range").textContent=fmtD(s)+" – "+fmtD(e)+" "+e.getFullYear();
  const seg=$("seg");seg.hidden=months.length<2;
  seg.innerHTML=months.map(m=>`<button aria-pressed="${m===cur}" data-m="${esc(m)}">${esc(m.slice(8,11))}${m.slice(0,4)!==String(today.getFullYear())?" "+m.slice(2,4):""}</button>`).join("");
  const byDay=Array(len).fill(0);R.forEach(r=>{const i=Math.round((r.date-s)/DAY);if(i>=0&&i<len)byDay[i]+=r.amt});
  const avg=total/Math.min(elapsed,len),big=R.reduce((a,r)=>r.amt>a.amt?r:a,{amt:0,note:""});
  const bud=budgets[cur];
  let ring;
  if(bud){const left=bud-total,p=Math.min(1,total/bud),C=2*Math.PI*44,dl=Math.max(1,len-elapsed+(today<=e?1:0));
    ring=`<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--fill)" stroke-width="11"/><circle cx="50" cy="50" r="44" fill="none" stroke="${left<0?"var(--ink)":"var(--teal)"}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div class="in"><b>${rm(Math.abs(left))}</b><span>${left<0?"over budget":"left to spend"}</span></div></div><p>${Math.round(p*100)}% of ${rm(bud)} salary used.<br>About <b>${rm(Math.max(0,left)/dl)}</b> a day for the next ${dl} days.</p>`}
  else ring=`<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--fill)" stroke-width="11"/></svg><div class="in"><b>No budget</b><span>this month</span></div></div><p>Add this month's salary in the Budget tab to see what's left.</p>`;
  const by={};R.forEach(r=>{by[r.cat]=by[r.cat]||{amt:0,emoji:r.emoji,n:0};by[r.cat].amt+=r.amt;by[r.cat].n++});
  const cats=Object.entries(by).sort((a,b)=>b[1].amt-a[1].amt);
  const col=i=>`color-mix(in srgb,var(--teal) ${Math.round((SH[i]??.16)*100)}%,transparent)`;
  const L=[...R].sort((a,b)=>b.date-a.date||b.time.localeCompare(a.time,undefined,{numeric:true})),shown=showAll?L:L.slice(0,8);
  let list="",lk="",first;
  shown.forEach(r=>{const k=r.date.toDateString();
    if(k!==lk){const dt=L.filter(x=>x.date.toDateString()===k).reduce((a,x)=>a+x.amt,0),diff=Math.round((today-r.date)/DAY);
      list+=`<div class="day"><span>${diff===0?"Today":diff===1?"Yesterday":r.date.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}</span><span>${rm(dt)}</span></div>`;lk=k;first=true}
    list+=`<div class="tx${first?" f":""}${r.pending?" pending":""}"><span class="ico">${esc(r.emoji)}</span><div><div class="n">${esc(r.note&&r.note!=="-"?r.note:r.cat)}</div><div class="c">${esc(r.cat)} · ${esc(r.time)}${r.pending?" · waiting to sync":""}</div></div><span class="a">${rm(r.amt)}</span></div>`;first=false});
  if(L.length>8)list+=`<button class="more" id="more">${showAll?"Show less":"Show all "+L.length}</button>`;
  if(!L.length)list=`<p class="empty">Nothing yet this month.</p>`;
  $("main").innerHTML=`
  <div class="grid">
    <section class="card gl"><p class="lab">Total spent</p>
      <div class="big"><small>RM</small>${total.toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
      <div class="meta"><div><b>${rm(avg)}</b><span>Daily average</span></div><div><b>${R.length}</b><span>Transactions</span></div><div><b>${rm(big.amt)}</b><span>${esc(big.note&&big.note!=="-"?big.note:"Biggest")}</span></div></div>
      <div class="chart" id="chart"></div></section>
    <section class="card gl ringc">${ring}</section>
  </div>
  <div class="grid">
    <section class="card gl"><h2>Recent</h2>${list}</section>
    <section class="card gl"><h2>Categories</h2>
      <div class="stor">${cats.map(([k,v],i)=>`<i style="width:${v.amt/total*100}%;background:${col(i)}"></i>`).join("")}</div>
      <ul class="legend">${cats.map(([k,v])=>`<li><span class="ico">${esc(v.emoji)}</span><span class="nm"><span>${esc(k)}</span><span class="c">${v.n} ${v.n>1?"items":"item"}</span></span><span class="pc">${Math.round(v.amt/total*100)}%</span><span class="amt">${rm(v.amt)}</span></li>`).join("")}</ul></section>
  </div>`;
  drawChart(byDay,avg,s,elapsed);
  const at=cache&&cache.at?new Date(cache.at):null;
  $("foot").textContent=(queue.length?queue.length+" waiting to sync · ":"")+(at?"Updated "+at.toLocaleTimeString("en-MY",{hour:"numeric",minute:"2-digit"}):"");
}
let lastChart=null;
function drawChart(d,avg,s,elapsed){const el=$("chart");if(!el)return;lastChart=[d,avg,s,elapsed];
  const W=el.clientWidth,H=el.clientHeight,b=20,top=8,max=Math.max(...d,avg,1)*1.08,n=d.length,step=W/n,bw=Math.max(2,step*.62);
  const y=v=>H-b-(v/max)*(H-b-top);
  let g=`<line x1="0" x2="${W}" y1="${H-b}" y2="${H-b}" stroke="var(--sep)"/>`;
  d.forEach((v,i)=>{const x=i*step+(step-bw)/2,fut=i>=elapsed;
    g+=`<rect x="${x}" y="${fut?H-b-3:y(v)}" width="${bw}" height="${fut?3:Math.max(v>0?2:3,H-b-y(v))}" rx="${Math.min(3,bw/2)}" fill="${fut||v===0?"var(--fill)":"url(#bg)"}"/>`;
    if((i%7===0&&i<n-4)||i===n-1)g+=`<text x="${i*step+step/2}" y="${H-4}" text-anchor="middle">${fmtD(new Date(+s+i*DAY))}</text>`});
  g+=`<line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--ink3)" stroke-dasharray="3 4"/><text x="${W}" y="${y(avg)-5}" text-anchor="end">avg ${rm(avg)}</text>`;
  el.innerHTML=`<svg aria-label="Daily spending"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--teal)"/><stop offset="1" stop-color="var(--teal)" stop-opacity=".45"/></linearGradient></defs>${g}</svg>`}
window.addEventListener("resize",()=>lastChart&&drawChart(...lastChart));

function renderSetup(){
  $("range").textContent="Welcome";$("seg").hidden=true;$("openAdd").hidden=true;$("foot").textContent="";
  $("main").innerHTML=`<section class="card gl setup"><h2>Connect your sheet</h2>
  <ol><li>Open your Apps Script project, tap <b>Deploy › Manage deployments</b>.</li><li>Copy the <b>Web app URL</b> (ends with /exec).</li><li>Paste it in Settings here.</li></ol>
  <button class="save" id="goSettings">Open Settings</button></section>`;
}

// ---------- sheets ----------
let openSheet=null;
function show(id){openSheet=$(id);$("scrim").classList.add("on");openSheet.classList.add("on")}
function hide(){if(!openSheet)return;openSheet.classList.remove("on");$("scrim").classList.remove("on");document.activeElement&&document.activeElement.blur();openSheet=null}
$("scrim").onclick=hide;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=hide);

let fCat="";
$("fCats").innerHTML=CATS.map(c=>{const sp=c.indexOf(" ");return`<button type="button" aria-pressed="false" data-c="${esc(c)}"><b>${c.slice(0,sp)}</b>${esc(c.slice(sp+1))}</button>`}).join("");
const valid=()=>{const a=parseFloat($("fAmt").value.replace(",","."));$("fSave").disabled=!(a>0&&fCat&&$("fDate").value)};
$("fCats").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;fCat=b.dataset.c;
  $("fCats").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));valid()};
$("fAmt").oninput=e=>{let v=e.target.value.replace(",",".").replace(/[^0-9.]/g,"");const i=v.indexOf(".");if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,"").slice(0,2);e.target.value=v;fit();valid()};
const fit=()=>{const v=$("fAmt").value;$("fAmt").style.width=Math.max(2.8,v.length*.6+.4)+"em"};
$("fDate").oninput=valid;
$("fRem").onkeydown=e=>{if(e.key==="Enter")e.target.blur()};
$("openAdd").onclick=()=>{const n=new Date();
  $("fAmt").value="";$("fRem").value="";fCat="";$("fCats").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
  $("fDate").value=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;$("fTime").value=`${pad(n.getHours())}:${pad(n.getMinutes())}`;
  fit();valid();show("addSheet");setTimeout(()=>$("fAmt").focus(),60)};
$("fSave").onclick=()=>{
  const a=Math.round(parseFloat($("fAmt").value.replace(",","."))*100)/100;if(!(a>0)||!fCat)return;
  const[y,m,d]=$("fDate").value.split("-").map(Number),[hh,mm]=($("fTime").value||"0:00").split(":").map(Number);
  queue.push({iso:$("fDate").value,date:`${pad(d)}/${pad(m)}/${y}`,time:`${hh}:${pad(mm)}`,category:fCat,amount:a,remark:$("fRem").value.trim()||"-",
    month:`${y}-${pad(m)} ${MF[m-1]}`});
  // the sheet files it under its active (salary) month if that is ahead of the calendar month
  const q=queue[queue.length-1],latest=months[months.length-1];
  q.show=latest&&latest.slice(0,7)>q.month.slice(0,7)?latest:q.month;
  store.set("queue",queue);hide();
  prep();render();flush();
};

$("openSettings").onclick=()=>{$("sUrl").value=URL_;$("sQueue").textContent=queue.length?queue.length+" expense(s) waiting to sync.":"";show("setSheet")};
$("sSave").onclick=()=>{const v=$("sUrl").value.trim();
  if(v&&!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){toast("That doesn't look like an Apps Script link");return}
  URL_=v;store.set("url",v);if(v)stamp();hide();render();load();flush()};
$("refresh").onclick=()=>{flush();load()};
document.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m){cur=m.dataset.m;showAll=false;render()}
  if(e.target.id==="more"){showAll=!showAll;render()}
  if(e.target.id==="goSettings")$("openSettings").click()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){flush();load(true)}});
window.addEventListener("online",()=>flush());

prep();render();flush();load(true);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
